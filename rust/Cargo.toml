[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# akeeper-ffi ne reprend pas ces lints : c'est la seule crate où l'unsafe (JNI, fd) est permis.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"

[workspace.dependencies]
akeeper-proto = { path = "crates/akeeper-proto" }
akeeper-engine = { path = "crates/akeeper-engine" }
mio = { version = "1.2", features = ["os-poll", "os-ext"] }
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
# unwind (pas abort) : catch_unwind à la frontière FFI évite de tuer l'app sur un panic résiduel.
panic = "unwind"
debug = "line-tables-only"
