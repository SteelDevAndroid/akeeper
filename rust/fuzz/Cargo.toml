[package]
name = "akeeper-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Espace de travail séparé : libfuzzer-sys exige nightly, le workspace principal reste sur stable.
[workspace]

[dependencies]
akeeper-proto = { path = "../crates/akeeper-proto" }
libfuzzer-sys = "0.4"

[[bin]]
name = "packet"
path = "fuzz_targets/packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns"
path = "fuzz_targets/dns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport"
path = "fuzz_targets/transport.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls"
path = "fuzz_targets/tls.rs"
test = false
doc = false
bench = false
