name: rules

# Construit et publie le bundle signé. Le préflight échoue explicitement si la configuration de signature manque.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

concurrency:
  group: rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate signing configuration
        env:
          RULES_SEED_B64: ${{ secrets.RULES_SEED_B64 }}
          RULES_KEY_ID: ${{ vars.RULES_KEY_ID }}
          RULES_PUBLIC_KEYS: ${{ vars.RULES_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          missing=0
          for name in RULES_SEED_B64 RULES_KEY_ID RULES_PUBLIC_KEYS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required to publish signed rules"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          case "$RULES_KEY_ID" in 0|1) ;; *) echo "::error::RULES_KEY_ID must be 0 or 1"; exit 1;; esac
          IFS=',' read -r -a keys <<< "$RULES_PUBLIC_KEYS"
          [ "${#keys[@]}" -ge 1 ] && [ "${#keys[@]}" -le 2 ] || { echo "::error::RULES_PUBLIC_KEYS must contain one or two keys"; exit 1; }
          for key in "${keys[@]}"; do
            [[ "$key" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Each public key must be 32-byte hex"; exit 1; }
          done
          [ "$RULES_KEY_ID" -lt "${#keys[@]}" ] || { echo "::error::RULES_KEY_ID has no matching public key"; exit 1; }
          seed_bytes="$(printf '%s' "$RULES_SEED_B64" | base64 -d 2>/dev/null | wc -c)"
          [ "$seed_bytes" -eq 32 ] || { echo "::error::RULES_SEED_B64 must decode to exactly 32 bytes"; exit 1; }

  publish:
    needs: preflight
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build, sign and reverify bundle
        env:
          RULES_SEED_B64: ${{ secrets.RULES_SEED_B64 }}
          RULES_KEY_ID: ${{ vars.RULES_KEY_ID }}
          RULES_PUBLIC_KEYS: ${{ vars.RULES_PUBLIC_KEYS }}
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          ALLOW_LIST_URL: ${{ vars.ALLOW_LIST_URL }}
          ALLOW_LIST_NOTICE: ${{ vars.ALLOW_LIST_NOTICE }}
        run: scripts/build-rules.sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
