name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

env:
  NDK_VERSION: "30.0.16248370"

jobs:
  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      # Même NDK pour cargo-ndk et pour AGP (ndkVersion du catalogue).
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      # Clé de release : décodée seulement si le secret existe (absent sur les PR de fork). L'APK reste sinon non signé.
      - name: Release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AKEEPER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      # Mêmes clés publiques que le pipeline de règles (rules.yml) : un APK sans elles n'accepte aucun bundle.
      - env:
          AKEEPER_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          AKEEPER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AKEEPER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RULE_PUBLIC_KEYS: ${{ vars.RULES_PUBLIC_KEYS }}
          RULES_URL: ${{ vars.RULES_URL }}
          MIN_RULE_VERSION: ${{ vars.MIN_RULE_VERSION || '0' }}
        run: >-
          ./gradlew check :app:assembleRelease :app:assembleDebug :app:bundleRelease
          "-Pakeeper.rulePublicKeys=$RULE_PUBLIC_KEYS"
          "-Pakeeper.rulesUrl=$RULES_URL"
          "-Pakeeper.minRuleVersion=$MIN_RULE_VERSION"
      - run: scripts/check-16kb.sh app/build/outputs/apk/release/app-release*.apk
      # APK debug (signé avec la clé de debug) : seul installable pour valider sur appareil. Release non signée.
      - uses: actions/upload-artifact@v4
        with:
          # Sur une PR, github.sha est le commit de merge temporaire : on nomme d'après le commit de la branche.
          name: akeeper-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release*.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [packet, dns, transport, tls, bundle]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      # Runners hébergés limités à 6 h par job : 5 h 30 par cible.
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=19800
